name: Build & Push Images (GHCR)

# Baut die produktiven Docker-Images (web, dashboard-api) aus dem Repo und
# pusht sie nach GitHub Container Registry (ghcr.io). Mittwald zieht diese
# Images per "image:"-Referenz in deploy/docker/docker-compose.mittwald.yml
# (Mittwalds Compose-Import unterstützt kein eigenes "build:").
#
# converter-mcp/converter-gateway sind hier NICHT dabei: ihr Build-Kontext
# (vendor/blender-mcp-converter) liegt nur lokal vor (gitignored, separates
# Blender-Projekt) und ist in GitHub Actions nicht erreichbar. Diese beiden
# Images müssen bis auf Weiteres lokal gebaut/gepusht werden, siehe
# deploy/docker/push-converter-images.sh.

on:
  push:
    branches: [online-docker]
    paths:
      - 'src/**'
      - 'public/**'
      - 'server/**'
      - 'scripts/**'
      - 'index.html'
      - 'dashboard.html'
      - 'converter.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'deploy/docker/Dockerfile.web'
      - 'deploy/docker/Dockerfile.dashboard-api'
      - '.github/workflows/build-images.yml'
  workflow_dispatch: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: showroom-web
            dockerfile: deploy/docker/Dockerfile.web
          - name: showroom-dashboard-api
            dockerfile: deploy/docker/Dockerfile.dashboard-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_ASSET_BASE_URL=${{ vars.VITE_ASSET_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
