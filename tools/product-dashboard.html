<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META Produktverwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
} }
</script>
<style>
:root {
  --bg-deep: #0a0a0b;
  --bg-surface: #111113;
  --bg-card: #18181b;
  --bg-elevated: #1f1f23;
  --bg-hover: #27272b;
  --border-subtle: #27272a;
  --border-default: #3f3f46;
  --border-accent: #d97706;
  --text-primary: #fafafa;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent: #f59e0b;
  --accent-dim: #b45309;
  --accent-glow: rgba(245, 158, 11, .12);
  --accent-glow-strong: rgba(245, 158, 11, .25);
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --shadow-card: 0 1px 3px rgba(0,0,0,.4), 0 0 0 1px var(--border-subtle);
  --shadow-elevated: 0 8px 32px rgba(0,0,0,.5), 0 0 0 1px var(--border-subtle);
  --transition: 180ms cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }
body {
  font-family: var(--font-display);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─────────── Noise texture overlay ─────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  opacity: .03;
  pointer-events: none;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px;
}

/* ─────────── Scrollbar ─────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ─────────── Shell layout ─────────── */
.shell {
  display: grid;
  grid-template-rows: auto auto auto 1fr;
  min-height: 100vh;
}

/* ─────────── Top bar ─────────── */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px) saturate(1.2);
}
.top-bar-left { display: flex; align-items: center; gap: 1rem; }
.logo {
  display: flex; align-items: center; gap: .6rem;
  font-weight: 700; font-size: 1.15rem; letter-spacing: -.02em;
}
.logo-mark {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  display: grid; place-items: center;
  font-weight: 800; font-size: .75rem; color: var(--bg-deep);
  letter-spacing: .05em;
}
.breadcrumb { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--text-muted); }
.breadcrumb span { color: var(--text-secondary); }
.top-bar-right { display: flex; align-items: center; gap: .75rem; }

/* ─────────── Stats strip ─────────── */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1px;
  background: var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.stat-card {
  background: var(--bg-surface);
  padding: 1.25rem 1.5rem;
  display: flex; flex-direction: column; gap: .25rem;
  transition: background var(--transition);
}
.stat-card:hover { background: var(--bg-card); }
.stat-label {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-muted); font-weight: 500;
}
.stat-value {
  font-family: var(--font-mono);
  font-size: 1.8rem; font-weight: 600; line-height: 1;
  letter-spacing: -.04em;
}
.stat-value.accent { color: var(--accent); }
.stat-sub { font-size: .75rem; color: var(--text-muted); }

/* ─────────── Toolbar ─────────── */
.toolbar {
  display: flex; align-items: center; gap: .75rem;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  flex-wrap: wrap;
}
.search-wrap {
  position: relative; flex: 1; min-width: 220px; max-width: 400px;
}
.search-icon {
  position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
  width: 16px; height: 16px;
}
.search-input {
  width: 100%; padding: .55rem .75rem .55rem 2.25rem;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--bg-card); color: var(--text-primary);
  font-family: var(--font-display); font-size: .85rem;
  outline: none; transition: border-color var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.filter-group { display: flex; gap: 2px; }
.filter-chip {
  padding: .4rem .85rem; border: 1px solid var(--border-subtle);
  background: var(--bg-card); color: var(--text-secondary);
  font-size: .78rem; font-weight: 500; cursor: pointer;
  transition: all var(--transition); user-select: none;
}
.filter-chip:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.filter-chip:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.filter-chip:hover { background: var(--bg-hover); color: var(--text-primary); }
.filter-chip.active {
  background: var(--accent-glow); border-color: var(--accent-dim);
  color: var(--accent);
}

.toolbar-spacer { flex: 1; }

.view-toggle { display: flex; gap: 2px; }
.view-btn {
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--border-subtle); background: var(--bg-card);
  color: var(--text-muted); cursor: pointer; transition: all var(--transition);
}
.view-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.view-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.view-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
.view-btn.active { color: var(--accent); background: var(--accent-glow); border-color: var(--accent-dim); }
.view-btn svg { width: 16px; height: 16px; }

.btn {
  display: inline-flex; align-items: center; gap: .45rem;
  padding: .5rem 1rem; border-radius: var(--radius-sm);
  font-size: .82rem; font-weight: 500; cursor: pointer;
  transition: all var(--transition); border: 1px solid transparent;
  font-family: var(--font-display);
}
.btn svg { width: 15px; height: 15px; }
.btn-primary {
  background: var(--accent); color: var(--bg-deep); border-color: var(--accent);
}
.btn-primary:hover { background: #fbbf24; }
.btn-ghost {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border-subtle);
}
.btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }
.btn-danger { background: rgba(239,68,68,.1); color: var(--danger); border-color: rgba(239,68,68,.3); }
.btn-danger:hover { background: rgba(239,68,68,.2); }

/* ─────────── Main content ─────────── */
.main-content { padding: 1.5rem 2rem 3rem; }

/* ─────────── Product grid ─────────── */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}
.product-grid.list-view {
  grid-template-columns: 1fr;
}

/* ─────────── Product card ─────────── */
.product-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all var(--transition);
  cursor: pointer;
  position: relative;
  animation: cardReveal .4s cubic-bezier(.22,1,.36,1) backwards;
}
.product-card:hover {
  border-color: var(--border-default);
  transform: translateY(-2px);
  box-shadow: var(--shadow-elevated);
}
.product-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow-strong), var(--shadow-elevated);
}
@keyframes cardReveal {
  from { opacity: 0; transform: translateY(12px); }
}

.card-preview {
  height: 200px;
  background: var(--bg-elevated);
  position: relative;
  overflow: hidden;
}
.card-preview canvas {
  width: 100% !important; height: 100% !important;
  display: block;
}
.card-preview-placeholder {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted);
  font-size: .8rem; flex-direction: column; gap: .5rem;
}
.card-preview-placeholder svg { width: 36px; height: 36px; opacity: .4; }

.card-type-badge {
  position: absolute; top: .6rem; left: .6rem;
  padding: .2rem .55rem; border-radius: 4px;
  font-size: .65rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; backdrop-filter: blur(8px);
}
.badge-single { background: rgba(59,130,246,.2); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }
.badge-composed { background: rgba(168,85,247,.2); color: #c084fc; border: 1px solid rgba(168,85,247,.3); }

.card-color-dot {
  position: absolute; top: .6rem; right: .6rem;
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.2);
  box-shadow: 0 2px 6px rgba(0,0,0,.4);
}

.card-body { padding: 1rem 1.15rem; }
.card-name {
  font-weight: 600; font-size: .95rem; margin-bottom: .15rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -.01em;
}
.card-id {
  font-family: var(--font-mono); font-size: .72rem;
  color: var(--text-muted); margin-bottom: .6rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.card-specs {
  display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .75rem;
}
.card-spec {
  display: flex; align-items: center; gap: .35rem;
  font-size: .75rem; color: var(--text-secondary);
}
.card-spec-label { color: var(--text-muted); min-width: 18px; text-align: center; }

.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: .65rem 1.15rem;
  border-top: 1px solid var(--border-subtle);
}
.card-tags { display: flex; gap: .35rem; flex-wrap: wrap; }
.card-tag {
  padding: .1rem .45rem; border-radius: 3px;
  font-size: .65rem; font-weight: 500;
}
.tag-glb { background: rgba(34,197,94,.1); color: var(--success); }
.tag-usdz { background: rgba(59,130,246,.1); color: var(--info); }
.tag-colorable { background: rgba(245,158,11,.1); color: var(--accent); }
.tag-hotspots { background: rgba(168,85,247,.1); color: #c084fc; }
.tag-shopware { background: rgba(236,72,153,.1); color: #f472b6; }
.tag-incomplete { background: rgba(239,68,68,.1); color: var(--danger); }

.card-actions { display: flex; gap: .3rem; }
.card-action {
  width: 28px; height: 28px; display: grid; place-items: center;
  border-radius: var(--radius-sm); border: none;
  background: transparent; color: var(--text-muted);
  cursor: pointer; transition: all var(--transition);
}
.card-action:hover { background: var(--bg-hover); color: var(--text-primary); }
.card-action svg { width: 14px; height: 14px; }

/* ─────────── List view card overrides ─────────── */
.list-view .product-card {
  display: grid;
  grid-template-columns: 180px 1fr auto;
  border-radius: var(--radius-md);
}
.list-view .card-preview { height: auto; min-height: 100px; border-radius: 0; }
.list-view .card-body { display: flex; align-items: center; gap: 1.5rem; padding: .75rem 1.25rem; }
.list-view .card-specs { display: flex; gap: 1rem; }
.list-view .card-footer {
  border-top: none; border-left: 1px solid var(--border-subtle);
  flex-direction: column; justify-content: center; padding: .75rem 1rem;
}
.list-view .card-tags { flex-direction: column; }

/* ─────────── Detail panel (slide-over) ─────────── */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.detail-overlay.open { opacity: 1; pointer-events: auto; }

.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(620px, 90vw); z-index: 201;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
  box-shadow: -20px 0 60px rgba(0,0,0,.5);
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.32, .72, 0, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.detail-panel.open { transform: translateX(0); }

.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-card);
  flex-shrink: 0;
}
.detail-title {
  font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 400px;
}
.detail-close {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle); background: var(--bg-elevated);
  color: var(--text-secondary); cursor: pointer; display: grid; place-items: center;
  transition: all var(--transition);
}
.detail-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.detail-close svg { width: 16px; height: 16px; }

.detail-content {
  flex: 1; overflow-y: auto; padding: 1.5rem;
}

.detail-preview {
  height: 280px; background: var(--bg-card);
  border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--border-subtle);
  margin-bottom: 1.5rem; position: relative;
}
.detail-preview canvas {
  width: 100% !important; height: 100% !important; display: block;
}

.detail-section {
  margin-bottom: 1.5rem;
}
.detail-section-title {
  font-size: .78rem; text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-muted); font-weight: 600;
  margin-bottom: .75rem;
  padding-bottom: .4rem;
  border-bottom: 1px solid var(--border-subtle);
}

.field-row {
  display: grid; grid-template-columns: 120px 1fr;
  align-items: start; gap: .5rem;
  margin-bottom: .6rem;
}
.field-label {
  font-size: .78rem; color: var(--text-muted); padding-top: .45rem;
  font-weight: 500;
}
.field-value {
  font-size: .85rem; padding: .4rem .65rem;
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-family: var(--font-display);
  transition: border-color var(--transition);
  outline: none; width: 100%;
}
.field-value:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}
.field-value[readonly] {
  background: var(--bg-elevated); color: var(--text-secondary);
  cursor: default;
}
textarea.field-value { resize: vertical; min-height: 60px; line-height: 1.5; }

.hotspot-list { display: flex; flex-direction: column; gap: .4rem; }
.hotspot-item {
  display: flex; align-items: center; gap: .65rem;
  padding: .5rem .75rem; background: var(--bg-card);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  font-size: .82rem;
}
.hotspot-icon {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent-glow); border: 1px solid var(--accent-dim);
  color: var(--accent); display: grid; place-items: center;
  font-size: .65rem; font-weight: 700; flex-shrink: 0;
}
.hotspot-title { font-weight: 500; }
.hotspot-content {
  color: var(--text-muted); font-size: .75rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}

.parts-list { display: flex; flex-direction: column; gap: .35rem; }
.part-item {
  display: flex; align-items: center; gap: .65rem;
  padding: .5rem .75rem; background: var(--bg-card);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  font-size: .82rem;
}
.part-count {
  font-family: var(--font-mono); font-weight: 600;
  color: var(--accent); font-size: .85rem; min-width: 24px;
}

.detail-footer {
  display: flex; gap: .6rem; justify-content: flex-end;
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-card);
  flex-shrink: 0;
}

/* ─────────── Empty state ─────────── */
.empty-state {
  text-align: center; padding: 4rem 2rem; color: var(--text-muted);
}
.empty-state svg { width: 56px; height: 56px; margin: 0 auto 1rem; opacity: .3; }
.empty-state p { font-size: .9rem; }

/* ─────────── Toast ─────────── */
.toast-container {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300;
  display: flex; flex-direction: column; gap: .5rem;
}
.toast {
  padding: .65rem 1.1rem; border-radius: var(--radius-md);
  font-size: .82rem; font-weight: 500;
  display: flex; align-items: center; gap: .5rem;
  box-shadow: var(--shadow-elevated);
  animation: toastIn .3s cubic-bezier(.22,1,.36,1);
  transition: opacity .2s, transform .2s;
}
.toast.removing { opacity: 0; transform: translateX(20px); }
.toast-success { background: rgba(34,197,94,.15); color: var(--success); border: 1px solid rgba(34,197,94,.3); }
.toast-error { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.3); }
.toast-info { background: rgba(59,130,246,.15); color: var(--info); border: 1px solid rgba(59,130,246,.3); }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } }

/* ─────────── Responsive ─────────── */
@media (max-width: 768px) {
  .top-bar, .toolbar, .main-content { padding-left: 1rem; padding-right: 1rem; }
  .product-grid { grid-template-columns: 1fr; }
  .stats-strip { grid-template-columns: repeat(2, 1fr); }
  .field-row { grid-template-columns: 1fr; }
  .field-label { padding-top: 0; }
}

/* ─────────── Utility ─────────── */
.visually-hidden {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
}
</style>
</head>
<body>
<div class="shell" id="app">

  <!-- ═══════ Top bar ═══════ -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="logo">
        <div class="logo-mark">M</div>
        <span>META</span>
      </div>
      <div class="breadcrumb">
        / <span>Produktverwaltung</span>
      </div>
    </div>
    <div class="top-bar-right">
      <button class="btn btn-ghost" onclick="loadProductsFile()" title="products.json laden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        JSON laden
      </button>
      <button class="btn btn-primary" onclick="exportJSON()" title="products.json speichern">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2 2h14a2 2 0 0 1 2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        JSON exportieren
      </button>
    </div>
  </header>

  <!-- ═══════ Stats strip ═══════ -->
  <section class="stats-strip" id="statsStrip"></section>

  <!-- ═══════ Toolbar ═══════ -->
  <nav class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" type="text" placeholder="Suche nach Name, ID oder Artikelnummer …" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">Alle</button>
      <button class="filter-chip" data-filter="single" onclick="setFilter('single',this)">Einzel</button>
      <button class="filter-chip" data-filter="composed" onclick="setFilter('composed',this)">Zusammengebaut</button>
      <button class="filter-chip" data-filter="incomplete" onclick="setFilter('incomplete',this)">Unvollständig</button>
    </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ══════════════════════════════════════════════════
   Globals
   ══════════════════════════════════════════════════ */
let products = [];
let filteredProducts = [];
let currentFilter = 'all';
let currentView = 'grid';
let selectedProductId = null;
const previewRenderers = new Map();

const RAL_HEX = {
  'RAL 7035': '#D7D7D7', 'RAL 7016': '#383E42', 'RAL 5010': '#004F7C',
  'RAL 9005': '#0E0E10', 'RAL 3000': '#A72920', 'RAL 6011': '#6D7F51',
  'RAL 1003': '#F0A000', 'RAL 5015': '#0071B5', 'RAL 9010': '#F1ECE1',
};

const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
gltfLoader.setDRACOLoader(dracoLoader);

/* ══════════════════════════════════════════════════
   Init: Try loading from relative project path
   ══════════════════════════════════════════════════ */
async function init() {
  try {
    const res = await fetch('../src/data/products.json');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    products = data.products || [];
    toast('Geladen: ' + products.length + ' Produkte aus products.json', 'success');
  } catch {
    products = [];
    toast('Kein products.json gefunden – bitte manuell laden', 'info');
  }
  renderAll();
}

/* ══════════════════════════════════════════════════
   Stats
   ══════════════════════════════════════════════════ */
function renderStats() {
  const total = products.length;
  const single = products.filter(p => p.type !== 'composed').length;
  const composed = products.filter(p => p.type === 'composed').length;
  const withGlb = products.filter(p => p.glbFile).length;
  const withSpecs = products.filter(p => p.specs && Object.values(p.specs).some(v => v && v !== '–')).length;
  const withShopware = products.filter(p => p.shopwareProductId).length;
  const incomplete = products.filter(p => isIncomplete(p)).length;

  document.getElementById('statsStrip').innerHTML = `
    <div class="stat-card">
      <span class="stat-label">Gesamt</span>
      <span class="stat-value accent">${total}</span>
      <span class="stat-sub">Produkte registriert</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Einzelteile</span>
      <span class="stat-value">${single}</span>
      <span class="stat-sub">mit GLB-Datei</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Zusammengebaut</span>
      <span class="stat-value">${composed}</span>
      <span class="stat-sub">aus Teilen zusammengesetzt</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">3D-Modelle</span>
      <span class="stat-value">${withGlb}</span>
      <span class="stat-sub">${total ? Math.round(withGlb/total*100) : 0}% Abdeckung</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Spezifikationen</span>
      <span class="stat-value">${withSpecs}</span>
      <span class="stat-sub">${total ? Math.round(withSpecs/total*100) : 0}% ausgefüllt</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Shopware</span>
      <span class="stat-value">${withShopware}</span>
      <span class="stat-sub">mit Produkt-ID</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Unvollständig</span>
      <span class="stat-value" style="color:${incomplete ? 'var(--danger)' : 'var(--success)'}">${incomplete}</span>
      <span class="stat-sub">${incomplete ? 'Daten fehlen' : 'alles komplett'}</span>
    </div>
  `;
}

function isIncomplete(p) {
  if (p.type === 'composed') return false;
  const noName = !p.name || p.name.startsWith('Produkt ');
  const noSpecs = !p.specs || Object.values(p.specs).every(v => !v || v === '–');
  const noShopware = !p.shopwareProductId;
  return noName || noSpecs || noShopware;
}

/* ══════════════════════════════════════════════════
   Filtering
   ══════════════════════════════════════════════════ */
function applyFilters() {
  const q = document.querySelector('.search-input').value.toLowerCase().trim();
  filteredProducts = products.filter(p => {
    if (currentFilter === 'single' && p.type === 'composed') return false;
    if (currentFilter === 'composed' && p.type !== 'composed') return false;
    if (currentFilter === 'incomplete' && !isIncomplete(p)) return false;
    if (q) {
      const haystack = `${p.id} ${p.name} ${p.shopwareProductId || ''} ${p.glbFile || ''}`.toLowerCase();
      return haystack.includes(q);
    }
    return true;
  });
  renderGrid();
}
window.applyFilters = applyFilters;

window.setFilter = function(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
  applyFilters();
};

window.setView = function(view, el) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const grid = document.getElementById('productGrid');
  grid.classList.toggle('list-view', view === 'list');
};

/* ══════════════════════════════════════════════════
   Render grid
   ══════════════════════════════════════════════════ */
function renderGrid() {
  disposeAllPreviews();
  const grid = document.getElementById('productGrid');
  grid.classList.toggle('list-view', currentView === 'list');

  if (filteredProducts.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <p>Keine Produkte gefunden</p></div>`;
    document.getElementById('resultCount').textContent = '';
    return;
  }

  document.getElementById('resultCount').textContent = filteredProducts.length + ' Produkte';

  grid.innerHTML = filteredProducts.map((p, i) => {
    const isComposed = p.type === 'composed';
    const badgeClass = isComposed ? 'badge-composed' : 'badge-single';
    const badgeLabel = isComposed ? 'Zusammengebaut' : 'Einzelteil';
    const color = RAL_HEX[p.defaultColor] || '#D7D7D7';
    const tags = buildTags(p);

    return `
    <div class="product-card" data-id="${p.id}" onclick="openDetail('${p.id}')"
         style="animation-delay:${i * 30}ms">
      <div class="card-preview" id="preview-${CSS.escape(p.id)}">
        <div class="card-preview-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <span>3D-Vorschau lädt …</span>
        </div>
        <span class="card-type-badge ${badgeClass}">${badgeLabel}</span>
        <span class="card-color-dot" style="background:${color}" title="${p.defaultColor}"></span>
      </div>
      <div class="card-body">
        <div class="card-name" title="${escHtml(p.name)}">${escHtml(p.name)}</div>
        <div class="card-id" title="${p.id}">${p.id}</div>
        <div class="card-specs">
          ${specBit('↕', p.specs?.height)}
          ${specBit('↔', p.specs?.width)}
          ${specBit('↗', p.specs?.depth)}
          ${specBit('⚖', p.specs?.load)}
        </div>
      </div>
      <div class="card-footer">
        <div class="card-tags">${tags}</div>
        <div class="card-actions">
          <button class="card-action" onclick="event.stopPropagation();openDetail('${p.id}')" title="Bearbeiten">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');

  requestAnimationFrame(() => loadAllPreviews());
}

function specBit(icon, val) {
  if (!val || val === '–') return '';
  return `<div class="card-spec"><span class="card-spec-label">${icon}</span>${escHtml(val)}</div>`;
}

function buildTags(p) {
  let t = '';
  if (p.glbFile) t += '<span class="card-tag tag-glb">GLB</span>';
  if (p.usdzFile) t += '<span class="card-tag tag-usdz">USDZ</span>';
  if (p.colorableMeshes?.length) t += '<span class="card-tag tag-colorable">Farben</span>';
  if (p.hotspots?.length > 1) t += `<span class="card-tag tag-hotspots">${p.hotspots.length} Hotspots</span>`;
  if (p.shopwareProductId) t += '<span class="card-tag tag-shopware">SW</span>';
  if (isIncomplete(p)) t += '<span class="card-tag tag-incomplete">Unvollständig</span>';
  return t;
}

/* ══════════════════════════════════════════════════
   3D preview rendering
   ══════════════════════════════════════════════════ */
function loadAllPreviews() {
  filteredProducts.forEach(p => {
    if (!p.glbFile) return;
    const container = document.getElementById(`preview-${CSS.escape(p.id)}`);
    if (!container) return;
    loadPreview(p, container);
  });
}

function loadPreview(product, container) {
  const w = container.clientWidth || 320;
  const h = container.clientHeight || 200;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, w / h, 0.01, 50);

  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
  dirLight.position.set(3, 5, 4);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xb0c4de, 0.6);
  fillLight.position.set(-2, 2, -1);
  scene.add(fillLight);

  const glbPath = '../public' + product.glbFile;

  gltfLoader.load(glbPath, (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 1.8;

    camera.position.set(center.x + dist * 0.5, center.y + dist * 0.35, center.z + dist * 0.7);
    camera.lookAt(center);

    renderer.render(scene, camera);

    const placeholder = container.querySelector('.card-preview-placeholder');
    if (placeholder) placeholder.style.display = 'none';
    container.insertBefore(renderer.domElement, container.firstChild);

    previewRenderers.set(product.id, { renderer, scene, camera, center, animId: null });

    let rot = 0;
    function spin() {
      rot += 0.004;
      camera.position.x = center.x + dist * 0.5 * Math.cos(rot) + dist * 0.7 * Math.sin(rot);
      camera.position.z = center.z + dist * 0.7 * Math.cos(rot) + dist * 0.5 * Math.sin(rot);
      camera.lookAt(center);
      renderer.render(scene, camera);
      const entry = previewRenderers.get(product.id);
      if (entry) entry.animId = requestAnimationFrame(spin);
    }

    container.addEventListener('mouseenter', () => {
      const e = previewRenderers.get(product.id);
      if (e && !e.animId) spin();
    });
    container.addEventListener('mouseleave', () => {
      const e = previewRenderers.get(product.id);
      if (e?.animId) { cancelAnimationFrame(e.animId); e.animId = null; }
    });
  }, undefined, () => {
    const placeholder = container.querySelector('.card-preview-placeholder');
    if (placeholder) {
      placeholder.querySelector('span').textContent = 'Modell nicht gefunden';
      placeholder.style.opacity = '.5';
    }
  });
}

function disposeAllPreviews() {
  previewRenderers.forEach((entry) => {
    if (entry.animId) cancelAnimationFrame(entry.animId);
    entry.renderer.dispose();
  });
  previewRenderers.clear();
}

/* ══════════════════════════════════════════════════
   Detail panel – large 3D + editing
   ══════════════════════════════════════════════════ */
let detailRenderer = null, detailControls = null, detailAnimId = null;

window.openDetail = function(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  selectedProductId = id;
  document.querySelectorAll('.product-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));

  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');

  const isComposed = p.type === 'composed';
  const content = document.getElementById('detailContent');

  content.innerHTML = `
    <div class="detail-preview" id="detailPreviewWrap">
      <div class="card-preview-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;opacity:.3">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span>${p.glbFile ? '3D-Vorschau lädt …' : 'Kein 3D-Modell'}</span>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">Stammdaten</div>
      <div class="field-row">
        <label class="field-label">ID</label>
        <input class="field-value" value="${escHtml(p.id)}" readonly>
      </div>
      <div class="field-row">
        <label class="field-label">Name</label>
        <input class="field-value" data-field="name" value="${escHtml(p.name)}">
      </div>
      <div class="field-row">
        <label class="field-label">Typ</label>
        <input class="field-value" value="${isComposed ? 'Zusammengebaut' : 'Einzelteil'}" readonly>
      </div>
      ${!isComposed ? `
      <div class="field-row">
        <label class="field-label">GLB-Datei</label>
        <input class="field-value" data-field="glbFile" value="${escHtml(p.glbFile || '')}">
      </div>
      <div class="field-row">
        <label class="field-label">USDZ-Datei</label>
        <input class="field-value" data-field="usdzFile" value="${escHtml(p.usdzFile || '')}">
      </div>
      ` : ''}
      <div class="field-row">
        <label class="field-label">Standard-Farbe</label>
        <input class="field-value" data-field="defaultColor" value="${escHtml(p.defaultColor || '')}">
      </div>
      <div class="field-row">
        <label class="field-label">Shopware-ID</label>
        <input class="field-value" data-field="shopwareProductId" value="${escHtml(p.shopwareProductId || '')}">
      </div>
      ${p.colorableMeshes?.length ? `
      <div class="field-row">
        <label class="field-label">Färbbar</label>
        <input class="field-value" data-field="colorableMeshes" value="${escHtml(p.colorableMeshes.join(', '))}">
      </div>` : ''}
    </div>

    ${!isComposed ? `
    <div class="detail-section">
      <div class="detail-section-title">Spezifikationen</div>
      <div class="field-row">
        <label class="field-label">Traglast</label>
        <input class="field-value" data-field="specs.load" value="${escHtml(p.specs?.load || '')}">
      </div>
      <div class="field-row">
        <label class="field-label">Höhe</label>
        <input class="field-value" data-field="specs.height" value="${escHtml(p.specs?.height || '')}">
      </div>
      <div class="field-row">
        <label class="field-label">Breite</label>
        <input class="field-value" data-field="specs.width" value="${escHtml(p.specs?.width || '')}">
      </div>
      <div class="field-row">
        <label class="field-label">Tiefe</label>
        <input class="field-value" data-field="specs.depth" value="${escHtml(p.specs?.depth || '')}">
      </div>
    </div>` : ''}

    ${p.hotspots?.length ? `
    <div class="detail-section">
      <div class="detail-section-title">Hotspots (${p.hotspots.length})</div>
      <div class="hotspot-list">
        ${p.hotspots.map((h, i) => `
          <div class="hotspot-item">
            <div class="hotspot-icon">${i + 1}</div>
            <div>
              <div class="hotspot-title">${escHtml(h.title)}</div>
              <div class="hotspot-content">${escHtml(h.content)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    ${isComposed && p.parts?.length ? `
    <div class="detail-section">
      <div class="detail-section-title">Teile (${p.parts.reduce((s,pt) => s + pt.count, 0)} Stück)</div>
      <div class="parts-list">
        ${p.parts.map(pt => {
          const partProduct = products.find(x => x.id === pt.productId);
          return `
          <div class="part-item">
            <span class="part-count">${pt.count}×</span>
            <span>${escHtml(partProduct?.name || pt.productId)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${p.shelves ? `
    <div class="detail-section">
      <div class="detail-section-title">Regalböden</div>
      <div class="field-row"><label class="field-label">Boden-Produkt</label><input class="field-value" value="${escHtml(p.shelves.productId)}" readonly></div>
      <div class="field-row"><label class="field-label">Breite (mm)</label><input class="field-value" value="${p.shelves.shelfWidthMm}" readonly></div>
      <div class="field-row"><label class="field-label">Tiefe (mm)</label><input class="field-value" value="${p.shelves.shelfDepthMm}" readonly></div>
    </div>` : ''}` : ''}
  `;

  if (p.glbFile) loadDetailPreview(p);
};

function loadDetailPreview(product) {
  disposeDetailPreview();
  const wrap = document.getElementById('detailPreviewWrap');
  if (!wrap) return;
  const w = wrap.clientWidth || 580;
  const h = wrap.clientHeight || 280;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  detailRenderer = renderer;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, w / h, 0.01, 100);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const d = new THREE.DirectionalLight(0xffffff, 2);
  d.position.set(4, 6, 5);
  scene.add(d);
  const f = new THREE.DirectionalLight(0xb0c4de, 0.7);
  f.position.set(-3, 3, -2);
  scene.add(f);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  detailControls = controls;

  const glbPath = '../public' + product.glbFile;
  gltfLoader.load(glbPath, (gltf) => {
    scene.add(gltf.scene);
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    controls.target.copy(center);
    camera.position.set(center.x + maxDim, center.y + maxDim * 0.6, center.z + maxDim * 1.2);
    controls.update();

    const placeholder = wrap.querySelector('.card-preview-placeholder');
    if (placeholder) placeholder.style.display = 'none';
    wrap.insertBefore(renderer.domElement, wrap.firstChild);
    renderer.domElement.style.borderRadius = 'var(--radius-md)';

    function animate() {
      detailAnimId = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  }, undefined, () => {
    const placeholder = wrap.querySelector('.card-preview-placeholder');
    if (placeholder) placeholder.querySelector('span').textContent = 'Modell nicht gefunden';
  });
}

function disposeDetailPreview() {
  if (detailAnimId) cancelAnimationFrame(detailAnimId);
  detailAnimId = null;
  if (detailControls) detailControls.dispose();
  detailControls = null;
  if (detailRenderer) detailRenderer.dispose();
  detailRenderer = null;
}

window.closeDetail = function() {
  disposeDetailPreview();
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  document.querySelectorAll('.product-card.selected').forEach(c => c.classList.remove('selected'));
  selectedProductId = null;
};

window.saveDetail = function() {
  if (!selectedProductId) return;
  const p = products.find(x => x.id === selectedProductId);
  if (!p) return;

  document.querySelectorAll('#detailContent [data-field]').forEach(input => {
    const path = input.dataset.field;
    const val = input.value.trim();

    if (path === 'colorableMeshes') {
      p.colorableMeshes = val ? val.split(',').map(s => s.trim()).filter(Boolean) : [];
    } else if (path.startsWith('specs.')) {
      const key = path.split('.')[1];
      if (!p.specs) p.specs = {};
      p.specs[key] = val;
    } else {
      p[path] = val;
    }
  });

  toast('Produkt „' + p.name + '" gespeichert', 'success');
  renderAll();
  window.openDetail(selectedProductId);
};

/* ══════════════════════════════════════════════════
   Load / Export JSON
   ══════════════════════════════════════════════════ */
window.loadProductsFile = function() {
  document.getElementById('fileInput').click();
};

window.onFileSelected = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      products = data.products || [];
      toast('Geladen: ' + products.length + ' Produkte', 'success');
      renderAll();
    } catch (err) {
      toast('Fehler beim Parsen: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

window.exportJSON = function() {
  const data = { products };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'products.json'; a.click();
  URL.revokeObjectURL(url);
  toast('products.json exportiert', 'success');
};

/* ══════════════════════════════════════════════════
   Render all
   ══════════════════════════════════════════════════ */
function renderAll() {
  renderStats();
  applyFilters();
}

/* ══════════════════════════════════════════════════
   Toast
   ══════════════════════════════════════════════════ */
function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 200);
  }, 3000);
}

/* ══════════════════════════════════════════════════
   Utilities
   ══════════════════════════════════════════════════ */
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* ══════════════════════════════════════════════════
   Keyboard
   ══════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selectedProductId) window.closeDetail();
  if ((e.metaKey || e.ctrlKey) && e.key === 'f') {
    e.preventDefault();
    document.querySelector('.search-input').focus();
  }
});

init();
</script>
</body>
</html>
