# Öffentlicher Reverse-Proxy: TLS (optional), Basic-Auth, Rate-Limits
limit_req_zone $binary_remote_addr zone=api_convert:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dashboard_api:10m rate=60r/m;

upstream showroom_web {
  server web:80;
}

upstream dashboard_api {
  server dashboard-api:5080;
}

upstream converter_gateway {
  server converter-gateway:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 512m;

  # ── Öffentlich: 3D-Showroom (read-only) ─────────────────────────────
  location / {
    proxy_pass http://showroom_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Geschützt: Dashboard & Konverter-UI ─────────────────────────────
  location = /dashboard.html {
    auth_basic "META Showroom";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_pass http://showroom_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /converter.html {
    auth_basic "META Showroom";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_pass http://showroom_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Geschützt: Dashboard-API ────────────────────────────────────────
  location /__api/ {
    auth_basic "META Showroom";
    auth_basic_user_file /etc/nginx/htpasswd;
    limit_req zone=dashboard_api burst=20 nodelay;
    proxy_pass http://dashboard_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location = /ralColors.json {
    proxy_pass http://dashboard_api;
    proxy_set_header Host $host;
  }

  # ── Öffentlich: laufzeit-generierte Assets (Thumbnails, Uploads) ────
  # dashboard-api hält showroom-public (Volume); web-Image enthält im
  # Online-Build kein public/models (siehe onlinePublicAssetsPlugin).
  location /models/ {
    proxy_pass http://dashboard_api;
    proxy_set_header Host $host;
  }

  # ── Geschützt: Konverter-Gateway ────────────────────────────────────
  location /api/ {
    auth_basic "META Showroom";
    auth_basic_user_file /etc/nginx/htpasswd;
    limit_req zone=api_convert burst=5 nodelay;
    proxy_pass http://converter_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  location /outputs/ {
    auth_basic "META Showroom";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_pass http://converter_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
