# META Showroom – Docker Compose (Online-Stack)
# Start aus Repo-Root:
#   npm run vendor:converter
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env up -d --build

name: meta-showroom-online

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  converter-mcp:
    build:
      context: ../../vendor/blender-mcp-converter
      dockerfile: Dockerfile.converter-mcp
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      BLENDER_PATH: /usr/bin/blender
      BLENDER_OUTPUT_DIR: /data/outputs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_ENABLED: ${CLAUDE_ENABLED:-false}
      GTIN_ENABLED: ${GTIN_ENABLED:-false}
    volumes:
      - converter-outputs:/data/outputs
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8001"

  converter-gateway:
    build:
      context: ../../vendor/blender-mcp-converter
      dockerfile: Dockerfile.converter-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_SERVER_URL: http://converter-mcp:8001
      BLENDER_OUTPUT_DIR: /data/outputs
      ALLOWED_ORIGINS: ${SHOWROOM_ORIGIN:-http://localhost}
      CLAUDE_ENABLED: ${CLAUDE_ENABLED:-false}
      GTIN_ENABLED: ${GTIN_ENABLED:-false}
      RATE_LIMIT_MAX: ${CONVERTER_RATE_LIMIT_MAX:-100}
    volumes:
      - converter-outputs:/data/outputs
    depends_on:
      - converter-mcp
      redis:
        condition: service_healthy
    expose:
      - "3000"

  dashboard-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DASHBOARD_API_PORT: 5080
      SHOWROOM_HOST: 0.0.0.0
      SHOWROOM_ORIGIN: ${SHOWROOM_ORIGIN:-http://localhost}
      SHOWROOM_API_TOKEN: ${SHOWROOM_API_TOKEN:-}
      CONVERTER_API_URL: http://converter-gateway:3000
      BLENDER_PATH: /usr/bin/blender
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - showroom-data:/app/src/data
      - showroom-public:/app/public
      - showroom-logs:/app/logs
    depends_on:
      - converter-gateway
    expose:
      - "5080"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - web
      - dashboard-api
      - converter-gateway

volumes:
  redis-data:
  converter-outputs:
  showroom-data:
  showroom-public:
  showroom-logs:
